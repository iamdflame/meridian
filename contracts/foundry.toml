[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Workspace-local pinned compiler (CI installs 0.8.28 via foundry-toolchain instead).
solc = "../.toolchain/solc-0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/vectors.json" },
]

[fmt]
line_length = 120

[rpc_endpoints]
monad = "${MONAD_RPC}"
